<!doctype html>
<html><head><meta charset="utf-8"><title>PVPN handoff waiting</title></head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#ff7a00;font-family:Arial">
<main style="text-align:center"><video id="handoffVideo" autoplay muted controls style="width:640px;max-width:92vw;background:#000"></video><p id="status">Waiting for source swap...</p></main>
<script>
(function(){
 var video=document.getElementById("handoffVideo"); var status=document.getElementById("status");
 video.addEventListener("playing",function(){status.textContent="PLAYING";document.title="PVPN handoff playing";});
 video.addEventListener("error",function(){status.textContent="ERROR";document.title="PVPN handoff error";});
 setTimeout(function(){status.textContent="SWAPPING";video.src="https://www.w3schools.com/html/mov_bbb.mp4";var promise=video.play();if(promise&&promise.catch)promise.catch(function(){status.textContent="PLAY BLOCKED";});},1200);
})();
</script></body></html>
