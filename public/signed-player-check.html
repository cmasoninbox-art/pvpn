<!doctype html>
<html><head><meta charset="utf-8"><title>SIGNED WAITING</title></head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#ff7a00;font-family:Arial">
<main style="text-align:center"><video id="v" autoplay muted controls style="width:640px;max-width:92vw;background:#000"></video><p id="status">CHECKING SIGNED DEFINITION</p></main>
<script>
(function(){
 var status=document.getElementById("status"); var video=document.getElementById("v");
 var signedUrl="https://www.w3schools.com/html/mov_bbb.mp4?pvpn_signed=PVPN%2Bvalue%2F4102444800";
 if(signedUrl.indexOf("https://")!==0||signedUrl.indexOf("PVPN%2Bvalue%2F4102444800")===-1){status.textContent="MUTATED";document.title="SIGNED MUTATED";return;}
 video.addEventListener("playing",function(){status.textContent="SIGNED PLAYING";document.title="SIGNED PLAYING";});
 video.addEventListener("error",function(){status.textContent="SIGNED ERROR";document.title="SIGNED ERROR";});
 setTimeout(function(){status.textContent="SIGNED SWAPPING";video.src=signedUrl;var p=video.play();if(p&&p.catch)p.catch(function(){status.textContent="SIGNED BLOCKED";document.title="SIGNED BLOCKED";});},900);
})();
</script></body></html>
